name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test the bundled build
        run: npm test
      - name: Test the unbundled source
        run: npm run test:src
      - uses: actions/upload-artifact@v4
        with:
          name: dawn-kingdom-build
          path: dist/
